    <title>Document</title>
    <style>
        body {
            background: #502258;
            color: white;
            font-family: system-ui, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .boton-inicio {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            transition: 0.2s;
        }
        .boton-inicio:hover { background: rgba(255, 255, 255, 0.3); }

        h3 { color: #ffb703; margin-bottom: 5px; }
        h1 { margin-top: 0; }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #ffb703;
        }
        .card:active { transform: scale(0.96); }
        .card img { border-radius: 10px; display: block; }
    </style>
</head>

</body>
